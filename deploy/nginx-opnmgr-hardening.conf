# ---------------------------------------------------------------------------
# OPNManager nginx hardening
#
# Include this INSIDE each OPNManager server{} block:
#
#     include /etc/nginx/snippets/opnmgr-hardening.conf;
#
# Every rule uses the `^~` prefix form, which tells nginx to stop and not
# evaluate regular-expression locations. That matters because the vhost has a
# catch-all `location ~ \.php$` that otherwise hands these paths to PHP-FPM.
# With `^~` the ordering of the include within the server block does not
# matter.
#
# Verified problems this closes on an unpatched install:
#   * /backups/<anything>.php executes as PHP. Combined with the upload
#     endpoint that is remote code execution as www-data.
#   * /scripts/*.php returns its own source, disclosing SSH key and tunnel
#     management logic.
#   * /inc/*.php and /cron/*.php are directly executable.
# ---------------------------------------------------------------------------

# --- Data directories: never executable, never listable ---------------------
# Configuration backups. Downloads go through api/download_backup.php, which
# authenticates and audits; nothing needs to fetch these directly.
location ^~ /backups/ {
    deny all;
    return 404;
}

location ^~ /diagnostics/ {
    deny all;
    return 404;
}

location ^~ /logs/ {
    deny all;
    return 404;
}

# --- Code that is not a web entry point -------------------------------------
# Maintenance and cron scripts. Invoked from cron on the CLI only.
location ^~ /scripts/ {
    deny all;
    return 404;
}

location ^~ /cron/ {
    deny all;
    return 404;
}

# Shared includes. Loaded via require_once, never requested directly.
location ^~ /inc/ {
    deny all;
    return 404;
}

location ^~ /src/ {
    deny all;
    return 404;
}

location ^~ /tests/ {
    deny all;
    return 404;
}

# Schema, migrations and the OPNsense plugin source tree.
location ^~ /database/ {
    deny all;
    return 404;
}

location ^~ /db/ {
    deny all;
    return 404;
}

location ^~ /plugin/ {
    deny all;
    return 404;
}

location ^~ /development/ {
    deny all;
    return 404;
}

location ^~ /deploy/ {
    deny all;
    return 404;
}

location ^~ /vendor/ {
    deny all;
    return 404;
}

location ^~ /node_modules/ {
    deny all;
    return 404;
}

# --- Secrets and metadata ----------------------------------------------------
location ^~ /keys/ {
    deny all;
    return 404;
}

# Dotfiles: .env, .git, .htaccess and friends.
location ~ /\. {
    deny all;
    return 404;
}

# Editor and backup leftovers, plus raw SQL dumps.
location ~* \.(bak|old|backup|orig|save|swp|swo|sql|dist|log|ini|sh~)$ {
    deny all;
    return 404;
}

location ~* ^/(VERSION|COMMIT|composer\.(json|lock)|package(-lock)?\.json|Makefile|.*\.md)$ {
    deny all;
    return 404;
}

# --- Response headers --------------------------------------------------------
add_header X-Frame-Options            "SAMEORIGIN"                     always;
add_header X-Content-Type-Options     "nosniff"                        always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
