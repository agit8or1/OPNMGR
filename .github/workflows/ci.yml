name: CI

on:
  push:
    branches: [main, 'security/**', 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, openssl, xml
          coverage: none

      - name: Version references agree
        run: php scripts/check_versions.php

      - name: Lint every PHP file
        run: |
          # backups/ holds ~20k captured firewall configs and vendor/ is third
          # party; neither is our source.
          find . -name '*.php' \
            -not -path './backups/*' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.archive/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  dependencies:
    # The name is a required status check in the "Require CI on main" ruleset;
    # the job now audits npm as well, but renaming it would block every merge.
    name: Composer validate and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate composer.json
        run: composer validate --no-check-publish

      # Blocking. Exit 1 = advisories (listed with the parent-package fix),
      # exit 2 = a scanner could not run - which is reported as such, never as
      # a clean result. This replaced `composer audit || true`, which turned
      # both findings and scanner failures into a pass.
      - name: Audit dependencies for known vulnerabilities
        run: php scripts/ci/dependency_audit.php

      - name: Audit classifier suite
        run: php tests/dependency_audit_test.php

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell scripts and the agent
        run: |
          # SC2039/SC2166: these target FreeBSD /bin/sh on OPNsense.
          find . -name '*.sh' \
            -not -path './backups/*' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 \
          | xargs -0 -r shellcheck -s sh -S warning -e SC2039,SC2166 || true

  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    # tests/bootstrap.php refuses any database not named opnsense_fw_test*.
    env:
      DB_NAME: opnsense_fw_test

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: opnsense_fw_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, openssl, xml, xmlwriter
          coverage: none

      # The application needs its Composer dependencies at runtime - the
      # two-factor enrolment page renders its QR with bacon/bacon-qr-code - so
      # the suites that exercise those paths need them installed here too.
      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Configure environment
        run: |
          cat > .env <<EOF
          DB_HOST=127.0.0.1
          DB_NAME=opnsense_fw_test
          DB_USER=root
          DB_PASS=ci-root
          APP_ENV=testing
          EOF
          php scripts/generate_master_key.php
          php scripts/sign_release.php --generate-key

      - name: Load schema (clean install path)
        run: |
          sed -e 's/`opnsense_fw`/`opnsense_fw_test`/g' database/schema.sql \
            | mysql -h 127.0.0.1 -u root -pci-root

      # schema.sql records every migration it already contains, so the first
      # migrate.php on a clean install applies nothing. Before 3.80.3 it re-ran
      # every migration, and those stored their old defaults (raw shell on,
      # admin MFA off). Regenerate schema.sql with scripts/generate_schema.sh
      # when a migration is added or changed.
      - name: Run migrations (must be a no-op on a fresh schema)
        run: |
          out="$(php scripts/migrate.php)"
          echo "$out"
          echo "$out" | grep -q '^Database is up to date' \
            || { echo "FAIL: migrate.php applied migrations on a fresh schema.sql - regenerate it"; exit 1; }
          if php scripts/migrate.php --status | grep -E 'PENDING|WARNING'; then
            echo "FAIL: schema.sql baseline is missing a migration or has a stale checksum"; exit 1
          fi

      - name: Clean install stores secure defaults
        run: |
          q() { mysql -h 127.0.0.1 -u root -pci-root -N opnsense_fw_test -e "SELECT value FROM settings WHERE name = '$1'"; }
          test "$(q raw_command_enabled)" = "0"    || { echo "FAIL: raw_command_enabled is not 0"; exit 1; }
          test "$(q require_mfa_for_admins)" = "1" || { echo "FAIL: require_mfa_for_admins is not 1"; exit 1; }
          test "$(q agent_auth_mode)" = "prefer_signed" || { echo "FAIL: agent_auth_mode is not prefer_signed"; exit 1; }

      - name: Migrations are idempotent
        run: |
          php scripts/migrate.php | grep -q '^Database is up to date'
          test "$(php scripts/migrate.php --status | grep -c PENDING)" = "0"

      - name: Security regression suite
        run: php tests/security_test.php

      - name: MSP model suite (roles, customers/sites, search)
        run: php tests/msp_test.php

      - name: Health and drift suite
        run: php tests/health_drift_test.php

      - name: Alerting and maintenance suite
        run: php tests/alerting_test.php

      - name: Fleet updates, bulk ops and config search suite
        run: php tests/fleet_test.php

      - name: AI redaction suite
        run: php tests/ai_redaction_test.php

      - name: Backup retention suite
        run: php tests/backup_retention_test.php

      - name: Command retry and reboot-loop suite
        run: php tests/agent_command_retry_test.php

      # A command waiting for an offline firewall is not a stuck command, and
      # an install that replaces the agent can never report its own result.
      - name: Stuck-command sweep suite
        run: php tests/command_sweep_test.php

      - name: Reboot state derivation suite
        run: php tests/reboot_state_test.php

      # Catches the class of bug where code names a column the schema does not
      # have. Those names live in SQL strings and array keys, so nothing else in
      # this pipeline reads them.
      - name: Schema/code column contract
        run: php tests/schema_columns_test.php

      # The enrolment secret must stay Base32 and the QR must stay local. Both
      # halves failed silently before: a wrong encoding just means the code
      # never matches, and a third-party QR still renders a picture.
      - name: Two-factor enrolment suite
        run: php tests/twofactor_test.php

      # A gated page that emits the header first cannot redirect, so its access
      # decision degrades into a 200 carrying a truncated page.
      - name: Auth ordering suite
        run: php tests/auth_ordering_test.php

      # Files the UI fetches, and files the server requires, must exist. Broad
      # .gitignore rules and bulk deletions have removed several of both.
      - name: Referenced files suite
        run: php tests/referenced_files_test.php

      # These scripts edit /conf/config.xml on a live customer firewall. The
      # suite runs the generated shell against a sample configuration.
      - name: Firewall policy suite
        run: php tests/firewall_policy_test.php

      # No installation-specific host, IP or SSH key may be compiled in. Over
      # thirty files carried the maintainer's own, which pointed a self-hosted
      # deployment's firewalls at a server its operator does not control.
      - name: Server identity suite
        run: php tests/server_identity_test.php

      # agent.sh is the only place the agent's version is declared. A second
      # literal in checkin.sh drifted eight releases behind and relabelled
      # healthy agents as outdated on every forced check-in.
      - name: Agent package suite
        run: php tests/agent_package_test.php

      # The scheduled jobs page described five jobs, three of which had never
      # been scheduled, behind an endpoint that was fatal on every request.
      - name: Scheduled jobs suite
        run: php tests/scheduled_jobs_test.php

      # Alerting that cannot deliver has to say so. This installation recorded
      # 911 failed notifications and not one delivery before anything surfaced
      # it, and the reason was replaced with "Internal server error".
      - name: Notification health suite
        run: php tests/notification_health_test.php

      # A call to a function that does not exist is a fatal that only appears
      # when that line is reached. verify2fa.php called clear2FA() on a correct
      # code; two-factor could not be completed by anyone.
      - name: Undefined functions suite
        run: php tests/undefined_functions_test.php

      # Settings changes were not audited at all, and the SMTP dialog both
      # printed the stored password into the page and wiped it on a blank save.
      - name: Settings audit suite
        run: php tests/settings_audit_test.php

      # users.is_active sat in the schema with nothing reading it, so setting
      # it to 0 looked like disabling an account and did nothing.
      - name: Account status suite
        run: php tests/account_status_test.php

      # manage_ssh_keys.php gated on a function defined nowhere: POST failed
      # closed and GET was not gated at all, returning SSH key fingerprints to
      # anyone who could reach the server.
      - name: Endpoint authorisation suite
        run: php tests/endpoint_authz_test.php

      # Signed in is not allowed: every login-gated page that writes, queues or
      # executes must also check a role (readonly could create admins pre-3.80.1).
      - name: Role gate suite
        run: php tests/role_gate_test.php

      # Two editors for one set of mail settings is how they drifted apart,
      # one of them leaking the stored password and wiping it on a blank save.
      - name: SMTP settings suite
        run: php tests/smtp_settings_test.php

      # require_mfa_for_admins sat in the settings table with nothing reading
      # it, so turning it on stored a 1 and changed no behaviour.
      - name: MFA requirement suite
        run: php tests/mfa_requirement_test.php

      # Restore has never been performed, so the script that would run on a
      # customer's firewall had never been executed by anything. This runs it
      # with curl and configctl stubbed.
      - name: Config restore suite
        run: php tests/config_restore_test.php

      # Agent request signing is verified, provisioned and policy-controlled
      # server-side, and no released agent can produce a signature.
      - name: Agent signing suite
        run: php tests/agent_signing_test.php

      # Two properties that hold today and are easy to lose one line at a time:
      # no query built by interpolation, and nothing a firewall reports
      # rendered unescaped in an administrator's browser.
      - name: Injection guard suite
        run: php tests/injection_guard_test.php

      # Four tables were 96% of the database after nine months of watching two
      # firewalls, and nothing had ever pruned them.
      - name: Telemetry retention suite
        run: php tests/telemetry_retention_test.php

      # A signature computed wrongly is worse than none: compatibility mode
      # verifies whenever one is present, so a malformed one refuses the
      # check-in. This runs the agent's own shell functions.
      - name: Agent request signing suite
        run: php tests/agent_request_signing_test.php

      # 3.79: mixed-fleet platform layer and the security fixes in the same
      # release.
      - name: Platform detection, capabilities and dispatch suite
        run: php tests/platform_test.php

      - name: Platform handling through the check-in endpoint
        run: php tests/platform_checkin_test.php

      - name: pfSense agent suite
        run: php tests/pfsense_agent_test.php

      - name: Enrollment installer suite
        run: php tests/enrollment_script_test.php

      - name: Session revocation suite
        run: php tests/session_revocation_test.php

      - name: Agent reset authorisation suite
        run: php tests/agent_reset_authz_test.php

      - name: Role gate behaviour suite
        run: php tests/role_gate_behaviour_test.php

      - name: Secure defaults and enrolment-bound claim suite
        run: php tests/secure_defaults_test.php

      # One enrolment token, one agent - with several requests racing for it.
      - name: Enrolment token concurrency suite
        run: php tests/enrollment_race_test.php

      # No secret is stored in plaintext because the master key is unusable.
      - name: Master key refusal suite
        run: php tests/crypto_refusal_test.php

      - name: Bandwidth test suite
        run: php tests/speedtest_test.php

      - name: Release manifest signs and verifies
        run: |
          # downloads/ is gitignored (release artifacts are large binaries and
          # are not kept in version control), so CI builds a fixture artifact
          # and exercises the real sign -> verify -> tamper-detection path
          # against it.
          mkdir -p downloads/plugins
          printf 'AGENT_VERSION="9.9.9"\necho ci-fixture\n' > downloads/agent.sh
          printf 'ci-fixture-package' > downloads/plugins/os-opnmanager-agent-9.9.9.tar.gz
          echo '9.9.9' > downloads/AGENT_VERSION.txt

          php scripts/sign_release.php --publish
          php scripts/sign_release.php --verify

          # A modified artifact must fail verification. If this passes, the
          # checksum check is not actually doing anything.
          printf 'tampered' >> downloads/plugins/os-opnmanager-agent-9.9.9.tar.gz
          if php scripts/sign_release.php --verify; then
            echo "FAIL: verification passed after tampering with an artifact"
            exit 1
          fi
          echo "Tampered artifact correctly rejected."

          # A modified manifest body must fail the signature check. Mutate it
          # through a JSON parse rather than sed, so the test does not silently
          # pass because the file's formatting changed.
          php scripts/sign_release.php --publish
          php -r '
            $f = "downloads/manifest.json";
            $e = json_decode(file_get_contents($f), true);
            $e["manifest"] = str_replace("\"size\":", "\"size\":1", $e["manifest"]);
            file_put_contents($f, json_encode($e));
          '
          if php scripts/sign_release.php --verify; then
            echo "FAIL: verification passed after tampering with the manifest"
            exit 1
          fi
          echo "Tampered manifest correctly rejected." 

  upgrade-path:
    name: Upgrade from the previous schema
    runs-on: ubuntu-latest
    env:
      DB_NAME: opnsense_fw_test

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: opnsense_fw_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, openssl, xml
          coverage: none

      - name: Load the schema as it was before this branch
        run: |
          git show origin/main:database/schema.sql > /tmp/old-schema.sql 2>/dev/null \
            || git show HEAD~1:database/schema.sql > /tmp/old-schema.sql
          sed -e 's/`opnsense_fw`/`opnsense_fw_test`/g' /tmp/old-schema.sql \
            | mysql -h 127.0.0.1 -u root -pci-root

      - name: Configure environment
        run: |
          cat > .env <<EOF
          DB_HOST=127.0.0.1
          DB_NAME=opnsense_fw_test
          DB_USER=root
          DB_PASS=ci-root
          EOF
          php scripts/generate_master_key.php

      - name: Migrate the old schema forward
        run: php scripts/migrate.php

      - name: Secret backfill is idempotent
        run: |
          php scripts/encrypt_secrets.php
          php scripts/encrypt_secrets.php | grep -q '0 value(s) encrypted'

      - name: Suites pass after upgrade
        run: |
          php tests/security_test.php
          php tests/msp_test.php
          php tests/health_drift_test.php
          php tests/alerting_test.php
          php tests/fleet_test.php
          php tests/ai_redaction_test.php
          php tests/reboot_state_test.php
